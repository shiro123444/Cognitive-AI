version: "3.9"

services:
  engine:
    build: ../backend
    ports:
      - "${ENGINE_PORT:-5001}:5001"
    environment:
      - ENGINE_NAME=${ENGINE_NAME:-EDUFISH}
      - ENGINE_API_KEY=${ENGINE_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3025}}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app.sqlite}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.xiaomimimo.com/v1}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-mimo-v2.5-pro}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - CHROMADB_DIR=${CHROMADB_DIR:-/app/instance/chromadb}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-false}
      - MULTI_TENANT_ENABLED=${MULTI_TENANT_ENABLED:-false}
    volumes:
      - engine_data:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3025}:80"
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

volumes:
  engine_data:
